name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # TEMPORARY (issue #220 live run; reverted after the probe completes): manual
  # dispatch of this workflow also runs the record-dir race probe. push/PR
  # events never trigger it. Permanent home of the probe is
  # .github/workflows/record-dir-race-probe.yml (dispatchable once on main).
  race-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: pinned revisions as worktrees (d436b53 pre-guard, 4367f60 guarded)
        run: |
          git worktree add "$RUNNER_TEMP/pre" d436b53
          git worktree add "$RUNNER_TEMP/guarded" 4367f60
      - name: runner environment
        run: bash sim/tools/record-dir-race-probe.sh env "$RUNNER_TEMP/pre"
      - name: mkdir atomicity micro-benchmark (/tmp and workspace)
        run: |
          for parent in /tmp "$RUNNER_TEMP"; do
            for opt in "" pin python pin-python; do
              bash sim/tools/record-dir-race-probe.sh micro "$parent" 1000 "$opt"
            done
          done
      - name: full reservation contract, pre-guard (d436b53)
        continue-on-error: true
        run: bash "$RUNNER_TEMP/pre/sim/tools/test-record-dir.sh"
      - name: full reservation contract, guarded (4367f60)
        continue-on-error: true
        run: bash "$RUNNER_TEMP/guarded/sim/tools/test-record-dir.sh"
      - name: bounded race repeat, pre-guard (d436b53)
        continue-on-error: true
        run: |
          for c in rx smoke tx-hbt tx-mos; do
            bash sim/tools/record-dir-race-probe.sh race "$RUNNER_TEMP/pre" "$c" 150
          done
      - name: bounded race repeat, guarded (4367f60)
        run: |
          for c in rx smoke tx-hbt tx-mos; do
            bash sim/tools/record-dir-race-probe.sh race "$RUNNER_TEMP/guarded" "$c" 150
          done
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # klt is pinned once, in layout/toolchain.json (klt_install); the committed
      # signoff record embeds its build fields, so it is only byte-stable under
      # that pin.
      - name: JSON validity
        run: scripts/check-ci.sh json
      - name: README relative links
        run: scripts/check-ci.sh links
      - name: Evidence-record freshness
        run: scripts/check-ci.sh fresh
      - name: Harness self-test
        run: scripts/check-ci.sh harness
      - name: Signoff drift
        run: scripts/check-ci.sh signoff
